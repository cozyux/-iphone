<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone</title>
<meta property="og:title" content="iPhone 잠금화면">
<meta property="og:description" content="잠금 화면 미리보기">
<meta name="robots" content="noindex">
 .colon { position: relative; top: -13px; }
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #fff; display: flex; align-items: center; justify-content: center;
  }

  .phone { position: fixed; inset: 0; overflow: hidden; background: #000; user-select: none; touch-action: none; }
  .wall {
    position: absolute; inset: 0; background: linear-gradient(160deg, #6f86b3, #2d3150 60%, #12131f);
    background-size: cover; background-position: center; transition: filter .3s;
  }
  .wall::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.28), rgba(0,0,0,.04) 40%, rgba(0,0,0,.3)); }
  .wall.blur { filter: blur(10px) brightness(.85); }

  .screen { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .screen.up { transform: translateY(-100%); }

  /* 상태바 */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 26px 0 44px; color: #fff; pointer-events: none; transition: opacity .3s;
  }
  .phone.passmode .statusbar { opacity: 0; }
  .statusbar .clk { font-size: 15.5px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.6px; }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; fill: #fff; }

  /* 잠금화면 */
  .lock-date { position: absolute; top: 84px; width: 100%; text-align: center; font-size: 19px; font-weight: 600; }
  .lock-clock {
    position: absolute; top: 112px; width: 100%; text-align: center;
    font-size: 112px; font-weight: 200; line-height: 1; letter-spacing: -7px; font-variant-numeric: tabular-nums;
  }
  .no-event { position: absolute; left: 32px; top: 290px; font-size: 14px; font-weight: 400; text-shadow: 0 1px 3px rgba(0,0,0,.25); }

  .notif {
    position: absolute; left: 15px; right: 15px; bottom: 150px; z-index: 4;
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px 16px; border-radius: 26px;
    background: rgba(255,255,255,.24); backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%);
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
  }
  .notif .app-icon { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; overflow: hidden;
    background: rgba(255,255,255,.95); display: flex; align-items: center; justify-content: center; }
  .notif .app-icon img { width: 100%; height: 100%; object-fit: cover; }
  .notif .body { flex: 1; min-width: 0; }
  .notif .top { display: flex; justify-content: space-between; align-items: center; }
  .notif .app-name { font-size: 15px; font-weight: 500; opacity: .92; }
  .notif .time-ago { font-size: 14px; opacity: .85; }
  .notif .title { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .notif .msg { font-size: 15px; line-height: 1.32; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .lock-btn {
    position: absolute; bottom: 40px; z-index: 4; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(40,40,44,.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    display: flex; align-items: center; justify-content: center;
  }
  .lock-btn.left { left: 48px; }
  .lock-btn.right { right: 48px; }
  .lock-btn svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .unlock-hint { position: absolute; bottom: 100px; width: 100%; text-align: center; font-size: 13px; opacity: .7; pointer-events: none; }

  /* 암호 입력 화면 */
  .pass { position: absolute; inset: 0; z-index: 15; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .pass.show { opacity: 1; pointer-events: auto; }
  .pass .wall-tint { position: absolute; inset: 0; background: rgba(255,255,255,.08); backdrop-filter: blur(22px) brightness(.9); -webkit-backdrop-filter: blur(22px) brightness(.9); }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 200px; height: 50px; border-radius: 30px;
    background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
  }
  .island svg { display: block; }
  .pass-title { position: absolute; top: 160px; width: 100%; text-align: center; font-size: 17px; font-weight: 500; }
  .dots { position: absolute; top: 196px; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; }
  .dots span { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #fff; transition: background .15s; }
  .dots span.on { background: #fff; }
  .dots.shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); }
  }

  .keypad {
    position: absolute; top: 284px; left: 0; right: 0; display: grid;
    grid-template-columns: repeat(3, 76px); column-gap: 25px; row-gap: 5px; justify-content: center;
  }
  .key {
    width: 76px; height: 76px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(120,140,190,.38); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: inherit; transition: background .12s;
  }
  .key:active { background: rgba(200,210,230,.6); }
  .key .n { font-size: 36px; font-weight: 400; line-height: 1; transform: scaleY(1); }
  .key .l { font-size: 10px; font-weight: 600; letter-spacing: 2.2px; margin-top: 2px; height: 12px; }
  .key.zero { grid-column: 2; }

  .pass-foot { position: absolute; top: 760px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 48px; font-size: 17px; font-weight: 400; }
  .pass-foot span { cursor: pointer; }

  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: #fff; z-index: 30; cursor: pointer;
  }

  /* 홈 화면 */
  .home { padding-top: 70px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 26px; padding: 0 14px; justify-items: center; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; width: 76px; }
  .app .ic {
    width: 60px; height: 60px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12); transition: transform .15s;
  }
  .app:active .ic { transform: scale(.92); }
  .app .ic svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .app .ic svg .f { fill: #fff; stroke: none; }
  .app span { font-size: 12px; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .dock {
    position: absolute; left: 12px; right: 12px; bottom: 26px; height: 92px; border-radius: 36px;
    background: rgba(255,255,255,.22); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    display: flex; justify-content: space-around; align-items: center; padding: 0 10px;
  }
  .dock .app span { display: none; }
  .dock .app { width: 64px; }
  .dock .ic { width: 62px; height: 62px; }

  /* 앱 공통 */
  .app-screen {
    position: absolute; inset: 0; z-index: 10; background: #000; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .42s cubic-bezier(.2,.8,.2,1);
  }
  .app-screen.open { transform: translateY(0); }
  .app-screen .head {
    padding: 62px 16px 10px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(20,20,22,.9); border-bottom: .5px solid #333; min-height: 110px; flex-shrink: 0;
  }
  .app-screen .head h1 { font-size: 32px; font-weight: 700; }
  .back { font-size: 17px; color: #0a84ff; cursor: pointer; padding: 6px 0; }
  .app-screen .content { flex: 1; overflow-y: auto; background: #000; padding-bottom: 40px; touch-action: pan-y; }
  .app-screen .content::-webkit-scrollbar { display: none; }

  /* 메시지 */
  .search { margin: 10px 16px 14px; height: 36px; border-radius: 10px; background: #1c1c1e; color: #8e8e93;
    display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .conv { display: flex; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .conv:active { background: #1c1c1e; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: #3a3a3c; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600; flex-shrink: 0; }
  .conv .info { flex: 1; min-width: 0; border-bottom: .5px solid #2c2c2e; padding-bottom: 12px; }
  .conv .row { display: flex; justify-content: space-between; align-items: center; }
  .conv .name { font-size: 17px; font-weight: 600; }
  .conv .date { font-size: 14px; color: #8e8e93; }
  .conv .prev { font-size: 15px; color: #8e8e93; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread { display: flex; flex-direction: column; gap: 6px; padding: 14px 12px; }
  .bubble { max-width: 72%; padding: 9px 14px; border-radius: 19px; font-size: 16px; line-height: 1.35; word-break: keep-all; }
  .bubble.in { background: #26262a; align-self: flex-start; border-bottom-left-radius: 6px; }
  .bubble.out { background: #0a84ff; align-self: flex-end; border-bottom-right-radius: 6px; }
  .stamp { align-self: center; font-size: 12px; color: #8e8e93; margin: 8px 0; }
  .inputbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px 30px; background: #000; border-top: .5px solid #2c2c2e; }
  .inputbar .fld { flex: 1; height: 36px; border: 1px solid #3a3a3c; border-radius: 18px; padding: 0 14px;
    color: #8e8e93; font-size: 16px; display: flex; align-items: center; }

  /* 편집 패널: ?edit 주소에서만 표시 */
  .panel {
    display: none; position: fixed; right: 16px; top: 16px; width: 300px; z-index: 100;
    background: #1f1f24; border-radius: 18px; padding: 22px; font-size: 14px; line-height: 1.5; max-height: 94vh; overflow: auto;
  }
  body.edit .panel { display: block; }
  body.edit .phone { inset: 0 0 0 auto; width: calc(100% - 340px); }
  .panel h2 { font-size: 18px; margin-bottom: 10px; }
  .panel label { display: block; margin: 12px 0 4px; color: #bbb; font-size: 13px; }
  .panel input[type="text"] { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #3a3a40; background: #2a2a30; color: #fff; font-size: 14px; }
  .panel input[type="file"] { width: 100%; color: #bbb; font-size: 12px; }
  .panel button { margin-top: 14px; width: 100%; padding: 10px; border: none; border-radius: 10px; background: #3a3a40; color: #fff; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="wall" id="wall"></div>

  <!-- 상태바 -->
  <div class="statusbar">
    <div class="clk" id="statusTime">12:54</div>
    <div class="right">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
      <!-- 와이파이: 부채꼴 3단 -->
      <svg width="17" height="13" viewBox="0 0 24 18"><path d="M0.686 5.686 A16 16 0 0 1 23.314 5.686 L20.132 8.868 A11.5 11.5 0 0 0 3.868 8.868 Z"/><path d="M4.222 9.222 A11 11 0 0 1 19.778 9.222 L16.596 12.404 A6.5 6.5 0 0 0 7.404 12.404 Z"/><path d="M12 17 L7.757 12.757 A6 6 0 0 1 16.243 12.757 Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="17.5" height="9" rx="2.4"/><path d="M25 4.5 V8.5 C25.8 8.2 26.5 7.3 26.5 6.5 C26.5 5.7 25.8 4.8 25 4.5Z" fill-opacity=".45"/></svg>
    </div>
  </div>

  <!-- 잠금화면 -->
  <div class="screen" id="lock">
    <div class="lock-date" id="date"></div>
    <div class="lock-clock" id="clock">12:54</div>
    <div class="no-event" id="noEvent">더 이상 이벤트 없음</div>
    <div class="notif" id="notif">
      <div class="app-icon" id="appIconBox"><span style="font-size:20px;font-weight:700;color:#333">M</span></div>
      <div class="body">
        <div class="top"><span class="app-name" id="appName">Netlify</span><span class="time-ago" id="timeAgo">12분 전</span></div>
        <div class="title" id="nTitle">Let's get your first project live</div>
        <div class="msg" id="nMsg">No experience required. Here's exactly where to start.</div>
      </div>
    </div>
    <div class="lock-btn left">
      <svg viewBox="0 0 24 24"><rect x="8" y="2.5" width="8" height="4" rx="1"/><path d="M7 6.5 H17 V10 L15 12.5 V21.5 H9 V12.5 L7 10 Z"/></svg>
    </div>
    <div class="lock-btn right">
      <svg viewBox="0 0 24 24"><path d="M3 8 Q3 6.5 4.5 6.5 H7 L8.5 4.5 H15.5 L17 6.5 H19.5 Q21 6.5 21 8 V18 Q21 19.5 19.5 19.5 H4.5 Q3 19.5 3 18 Z"/><circle cx="12" cy="13" r="3.8"/></svg>
    </div>
    <div class="unlock-hint">위로 밀어서 잠금 해제</div>
  </div>

  <!-- 암호 입력 화면 -->
  <div class="pass" id="pass">
    <div class="wall-tint"></div>
    <div class="island">
      <svg width="16" height="18" viewBox="0 0 16 18"><rect x="1" y="7" width="14" height="10" rx="2.5" fill="#fff"/><path d="M4.5 7 V5 A3.5 3.5 0 0 1 11.5 5 V7" fill="none" stroke="#fff" stroke-width="2"/></svg>
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.8" stroke-linecap="round"><path d="M2 7 V4 A2 2 0 0 1 4 2 H7"/><path d="M15 2 H18 A2 2 0 0 1 20 4 V7"/><path d="M20 15 V18 A2 2 0 0 1 18 20 H15"/><path d="M7 20 H4 A2 2 0 0 1 2 18 V15"/><circle cx="8" cy="9" r="1" fill="rgba(255,255,255,.55)"/><circle cx="14" cy="9" r="1" fill="rgba(255,255,255,.55)"/><path d="M7.5 14 Q11 16.5 14.5 14"/></svg>
    </div>
    <div class="pass-title">암호 입력</div>
    <div class="dots" id="dots"></div>
    <div class="keypad" id="keypad"></div>
    <div class="pass-foot"><span id="emerg">긴급상황</span><span id="cancel">취소</span></div>
  </div>

  <!-- 홈 화면 -->
  <div class="screen hidden" id="home">
    <div class="home"><div class="grid" id="grid"></div></div>
    <div class="dock" id="dock"></div>
  </div>

  <!-- 메시지 앱 -->
  <div class="app-screen" id="msgApp">
    <div class="head"><span></span><h1>메시지</h1><span></span></div>
    <div class="content" id="convList"><div class="search">🔍 검색</div></div>
  </div>

  <!-- 대화창 -->
  <div class="app-screen" id="threadApp" style="z-index:11">
    <div class="head" style="flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px;min-height:120px">
      <div style="display:flex;width:100%;justify-content:space-between;align-items:center">
        <span class="back" id="backBtn">‹ 메시지</span><span></span>
      </div>
      <div class="avatar" id="thAvatar" style="width:44px;height:44px;margin-top:6px"></div>
      <div id="thName" style="font-size:14px;font-weight:600;margin-top:4px"></div>
    </div>
    <div class="content" id="thread"></div>
    <div class="inputbar"><div class="fld">iMessage</div></div>
  </div>

  <div class="home-bar" id="homeBar"></div>
</div>

<!-- 편집 패널 -->
<div class="panel">
  <h2>화면 설정</h2>
  <label>배경화면 사진</label>
  <input type="file" id="wallInput" accept="image/*">
  <label>알림 앱 아이콘 (선택)</label>
  <input type="file" id="iconInput" accept="image/*">
  <label>앱 이름</label>
  <input type="text" id="inAppName" value="Netlify">
  <label>알림 시간 표시</label>
  <input type="text" id="inTimeAgo" value="12분 전">
  <label>알림 제목</label>
  <input type="text" id="inTitle" value="Let's get your first project live">
  <label>알림 내용</label>
  <input type="text" id="inMsg" value="No experience required. Here's exactly where to start.">
  <label>잠금화면 이벤트 문구</label>
  <input type="text" id="inNoEvent" value="더 이상 이벤트 없음">
  <button id="lockBtn">잠금 화면으로 돌아가기</button>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const phone = $('phone');
  if (location.search.includes('edit')) document.body.classList.add('edit');

  // ★ 비밀번호 (여기를 원하는 번호로 바꾸세요)
  const PASSCODE = '1204';

  const DAYS = ['일','월','화','수','목','금','토'];
  const pad = (n) => String(n).padStart(2, '0');
  function tick() {
    const now = new Date();
    const t = `${pad(now.getHours())}<span class="colon">:</span>${pad(now.getMinutes())}`;
    $('clock').innerHTML = t;
    $('statusTime').innerHTML = t;
    $('date').textContent = `${now.getMonth()+1}월 ${now.getDate()}일 ${DAYS[now.getDay()]}요일`;
  }
  tick(); setInterval(tick, 1000);

  // ---------- 암호 키패드 ----------
  const KEYS = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['0','']];
  $('keypad').innerHTML = KEYS.map(([n, l]) =>
    `<button class="key ${n==='0'?'zero':''}" data-k="${n}"><span class="n">${n}</span><span class="l">${l}</span></button>`).join('');
  $('dots').innerHTML = Array.from({length: PASSCODE.length}, () => '<span></span>').join('');
  let entered = '';

  function renderDots() {
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < entered.length));
  }
  function wrongCode() {
    const d = $('dots');
    d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
    entered = ''; setTimeout(renderDots, 250);
  }
  $('keypad').addEventListener('click', (e) => {
    const k = e.target.closest('.key'); if (!k) return;
    if (entered.length >= PASSCODE.length) return;
    entered += k.dataset.k; renderDots();
    if (entered.length === PASSCODE.length) {
      setTimeout(() => { entered === PASSCODE ? showHome() : wrongCode(); }, 150);
    }
  });
  $('cancel').addEventListener('click', () => { entered = ''; renderDots(); showLock(); });

  // ---------- 아이콘 ----------
  const ICONS = {
    weather: '<svg viewBox="0 0 32 32"><circle cx="12" cy="12" r="5" class="f"/><path d="M12 3v2M3 12h2M5.6 5.6l1.4 1.4M18.4 5.6 17 7"/><path d="M10 26h13a4.5 4.5 0 0 0 .4-9 6 6 0 0 0-11.6-1.5A4.8 4.8 0 0 0 10 26z"/></svg>',
    music: '<svg viewBox="0 0 32 32"><path d="M12 24V8l14-3v16"/><circle cx="8" cy="24" r="3.5" class="f"/><circle cx="22" cy="21" r="3.5" class="f"/></svg>',
    facetime: '<svg viewBox="0 0 32 32"><rect x="4" y="8" width="16" height="16" rx="3"/><path d="M20 14l8-4v12l-8-4z"/></svg>',
    calendar: '<svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="22" rx="3"/><path d="M4 12h24M10 3v6M22 3v6"/><text x="16" y="25" font-size="10" text-anchor="middle" fill="#fff" stroke="none" font-family="sans-serif">24</text></svg>',
    camera: '<svg viewBox="0 0 32 32"><path d="M4 11q0-2 2-2h4l2-3h8l2 3h4q2 0 2 2v12q0 2-2 2H6q-2 0-2-2z"/><circle cx="16" cy="17" r="5"/></svg>',
    mail: '<svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="18" rx="3"/><path d="M4 9l12 9 12-9"/></svg>',
    reminder: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><path d="M16 9v7l4 3"/></svg>',
    games: '<svg viewBox="0 0 32 32"><circle cx="16" cy="13" r="3.5" class="f"/><circle cx="8" cy="20" r="3.5" class="f"/><circle cx="24" cy="20" r="3.5" class="f"/></svg>',
    appstore: '<svg viewBox="0 0 32 32"><path d="M11 24l5-9M21 24l-9-16M9 19h14M7 24h18"/></svg>',
    safari: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><path d="M21 11l-3 7-7 3 3-7z" class="f"/></svg>',
    message: '<svg viewBox="0 0 32 32"><path d="M16 6c7 0 12 4 12 9s-5 9-12 9c-1.5 0-3-.2-4.3-.6L6 26l1.8-4.4C5.9 20.2 4 18 4 15c0-5 5-9 12-9z"/></svg>',
    phone: '<svg viewBox="0 0 32 32"><path d="M8 4l5 1 2 6-3 2c1.5 3.5 4 6 7.5 7.5l2-3 6 2 1 5c0 1-1 2-2 2C14 27 5 18 5 6c0-1 1-2 3-2z"/></svg>'
  };
  const APPS = [
    { id:'weather', name:'날씨', icon:'weather' }, { id:'music', name:'음악', icon:'music' },
    { id:'facetime', name:'FaceTime', icon:'facetime' }, { id:'calendar', name:'캘린더', icon:'calendar' },
    { id:'camera', name:'카메라', icon:'camera' }, { id:'mail', name:'Mail', icon:'mail' },
    { id:'reminder', name:'미리 알림', icon:'reminder' }, { id:'games', name:'Games', icon:'games' },
    { id:'appstore', name:'App Store', icon:'appstore' }, { id:'safari', name:'Safari', icon:'safari' },
    { id:'messages', name:'메시지', icon:'message' },
  ];
  const DOCK = [
    { id:'phone', name:'전화', icon:'phone' }, { id:'safari', name:'Safari', icon:'safari' },
    { id:'messages', name:'메시지', icon:'message' }, { id:'music', name:'음악', icon:'music' },
  ];
  const appHTML = (a) => `<div class="app" data-id="${a.id}"><div class="ic">${ICONS[a.icon]}</div><span>${a.name}</span></div>`;
  $('grid').innerHTML = APPS.map(appHTML).join('');
  $('dock').innerHTML = DOCK.map(appHTML).join('');

  // ---------- 대화 데이터 ----------
  const CONVS = [
    { name:'+82 10-9174-5963', date:'어제', prev:'[Web발신] 진심을 다하는 롯데택배입니다.…', init:'1', msgs:[
      {from:'in', t:'[Web발신] 진심을 다하는 롯데택배입니다. 금일 배송 예정입니다.'}] },
    { name:'+82 10-8467-6382', date:'어제', prev:'최지우고객님!…', init:'2', msgs:[
      {from:'in', t:'최지우고객님! 주문하신 상품이 출고되었습니다.'}] },
    { name:'강민영', date:'월요일', prev:'니 오늘 당직인데 왜안옴ㅅㅂ', init:'강', msgs:[
      {from:'in', t:'니 오늘 당직인데 왜안옴ㅅㅂ'}, {from:'out', t:'아 미안 담에는 봐줄게'}] },
    { name:'+82 1577-7026', date:'2026. 10. 7.', prev:'쿠팡 배송 확인, 주문번호는 15103406916247', init:'C', msgs:[
      {from:'in', t:'쿠팡 배송 확인, 주문번호는 15103406916247, 15103413029418'}] },
    { name:'1368', date:'2026. 10. 1.', prev:'[Web발신] ■ 제목 : 가입내역안내서 확인하기', init:'1', msgs:[
      {from:'in', t:'[Web발신] ■ 제목 : 가입내역안내서 확인하기'}] },
  ];
  $('convList').insertAdjacentHTML('beforeend', CONVS.map((c, i) => `
    <div class="conv" data-conv="${i}">
      <div class="avatar">${c.init}</div>
      <div class="info">
        <div class="row"><span class="name">${c.name}</span><span class="date">${c.date} ›</span></div>
        <div class="prev">${c.prev}</div>
      </div>
    </div>`).join(''));

  // ---------- 화면 전환 ----------
  let state = 'lock';
  function showPass() {
    state = 'pass';
    phone.classList.add('passmode');
    $('pass').classList.add('show');
  }
  function showHome() {
    state = 'home';
    entered = ''; renderDots();
    phone.classList.remove('passmode');
    $('pass').classList.remove('show');
    $('lock').classList.add('up');
    $('home').classList.remove('hidden');
    $('wall').classList.add('blur');
  }
  function showLock() {
    state = 'lock';
    entered = ''; renderDots();
    $('msgApp').classList.remove('open'); $('threadApp').classList.remove('open');
    phone.classList.remove('passmode');
    $('pass').classList.remove('show');
    $('lock').classList.remove('up');
    $('home').classList.add('hidden');
    $('wall').classList.remove('blur');
  }
  const openThread = (i) => {
    const c = CONVS[i];
    $('thAvatar').textContent = c.init;
    $('thName').textContent = c.name;
    $('thread').innerHTML = `<div class="stamp">${c.date}</div>` + c.msgs.map(m => `<div class="bubble ${m.from}">${m.t}</div>`).join('');
    $('threadApp').classList.add('open');
  };

  document.addEventListener('click', (e) => {
    const app = e.target.closest('.app');
    if (app && state === 'home') { if (app.dataset.id === 'messages') $('msgApp').classList.add('open'); return; }
    const conv = e.target.closest('.conv');
    if (conv) return openThread(+conv.dataset.conv);
    if (e.target.closest('#backBtn')) $('threadApp').classList.remove('open');
  });

  $('homeBar').addEventListener('click', (e) => {
    e.stopPropagation();
    if ($('threadApp').classList.contains('open')) return $('threadApp').classList.remove('open');
    if ($('msgApp').classList.contains('open')) return $('msgApp').classList.remove('open');
    if (state === 'home') showLock();
  });

  // 잠금 해제: 잠금화면에서 위로 밀면 암호 화면 / 홈에서 아래로 밀면 잠금
  let startY = null, mode = null;
  phone.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.panel') || e.target.closest('.key')) return;
    startY = e.clientY; mode = state;
  });
  window.addEventListener('pointermove', (e) => {
    if (startY === null || mode !== 'lock') return;
    const dy = Math.max(0, startY - e.clientY);
    $('lock').style.transition = 'none';
    $('lock').style.transform = `translateY(${-Math.min(dy, 844)}px)`;
  });
  window.addEventListener('pointerup', (e) => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    $('lock').style.transition = ''; $('lock').style.transform = '';
    if (mode === 'lock' && startY - e.clientY > 100) showPass();
    if (mode === 'home' && dy > 120 && !$('msgApp').classList.contains('open')) showLock();
    startY = null;
  });

  // 배경 / 알림 설정
  $('wallInput').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    $('wall').style.backgroundImage = `url(${URL.createObjectURL(f)})`;
  });
  $('iconInput').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    $('appIconBox').innerHTML = `<img src="${URL.createObjectURL(f)}" alt="">`;
  });
  const bind = (inputId, targetId) => $(inputId).addEventListener('input', (e) => { $(targetId).textContent = e.target.value; });
  bind('inAppName', 'appName'); bind('inTimeAgo', 'timeAgo'); bind('inTitle', 'nTitle');
  bind('inMsg', 'nMsg'); bind('inNoEvent', 'noEvent');
  $('lockBtn').addEventListener('click', showLock);
</script>
</body>
</html>
