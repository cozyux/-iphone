<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Lock Screen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
                 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #15151a;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    gap: 48px; padding: 24px; flex-wrap: wrap; color: #fff;
  }

  /* ---------- 폰 본체 ---------- */
  .phone {
    position: relative; width: 390px; height: 844px;
    border-radius: 55px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 9px #1d1d1f, 0 0 0 11px #3a3a3c, 0 30px 70px rgba(0,0,0,.6);
    user-select: none;
  }

  /* 배경화면 */
  .wall {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, #6f86b3, #2d3150 60%, #12131f);
    background-size: cover; background-position: center;
  }
  .wall::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.28), rgba(0,0,0,.04) 40%, rgba(0,0,0,.28));
  }

  /* 상태바 */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px 0 0; font-size: 17px; font-weight: 600; color: #fff;
  }
  .statusbar .carrier { width: 115px; text-align: center; font-variant-numeric: tabular-nums; }
  .statusbar .right { width: 115px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .statusbar svg { display: block; fill: #fff; }

  /* 잠금화면 시계 */
  .lock-content {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 3;
    text-align: center; color: #fff;
  }
  .date {
    margin-top: 80px; font-size: 19px; font-weight: 600; letter-spacing: -.2px;
  }
  .clock {
    font-size: 128px; font-weight: 200; line-height: 1; letter-spacing: -3px;
    font-variant-numeric: tabular-nums; margin-top: 2px;
  }
  .no-event {
    position: absolute; left: 32px; top: 222px; font-size: 14px; font-weight: 500;
    color: rgba(255,255,255,.92); text-shadow: 0 1px 3px rgba(0,0,0,.25);
  }

  /* 에어팟 위젯 */
  .widget {
    position: absolute; right: 34px; top: 226px; width: 58px; height: 58px;
  }
  .widget svg { width: 58px; height: 58px; }

  /* 알림 */
  .notif {
    position: absolute; left: 15px; right: 15px; bottom: 150px; z-index: 4;
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 16px 16px; border-radius: 26px;
    background: rgba(255,255,255,.24);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
  }
  .notif .app-icon {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: rgba(255,255,255,.95); display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .notif .app-icon img { width: 100%; height: 100%; object-fit: cover; }
  .notif .body { flex: 1; min-width: 0; }
  .notif .top { display: flex; justify-content: space-between; align-items: center; }
  .notif .app-name { font-size: 15px; font-weight: 500; color: #fff; opacity: .92; }
  .notif .time-ago { font-size: 14px; color: rgba(255,255,255,.85); }
  .notif .title { font-size: 16px; font-weight: 700; margin-top: 2px; color: #fff; }
  .notif .msg {
    font-size: 15px; line-height: 1.32; color: #fff; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* 하단 버튼 */
  .bottom-btn {
    position: absolute; bottom: 40px; z-index: 4;
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(40,40,44,.55); backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex; align-items: center; justify-content: center;
  }
  .bottom-btn.left { left: 48px; }
  .bottom-btn.right { right: 48px; }
  .bottom-btn svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

  /* 홈 인디케이터 */
  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: #fff; z-index: 6;
  }

  /* ---------- 편집 패널 ---------- */
  .panel {
    width: 300px; background: #1f1f24; border-radius: 18px; padding: 22px;
    font-size: 14px; line-height: 1.5;
  }
  .panel h2 { font-size: 18px; margin-bottom: 14px; }
  .panel label { display: block; margin: 12px 0 4px; color: #bbb; font-size: 13px; }
  .panel input[type="text"] {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #3a3a40;
    background: #2a2a30; color: #fff; font-size: 14px;
  }
  .panel input[type="file"] { width: 100%; color: #bbb; font-size: 12px; }
  .panel .hint { color: #888; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <!-- 배경화면 -->
  <div class="wall" id="wall"></div>

  <!-- 상태바 -->
  <div class="statusbar">
    <div class="carrier" id="statusTime">12:54</div>
    <div class="right">
      <!-- 신호 -->
      <svg width="18" height="12" viewBox="0 0 18 12">
        <rect x="0"  y="8" width="3" height="4" rx="1"/>
        <rect x="5"  y="5.5" width="3" height="6.5" rx="1"/>
        <rect x="10" y="3" width="3" height="9" rx="1"/>
        <rect x="15" y="0" width="3" height="12" rx="1"/>
      </svg>
      <!-- 와이파이 -->
      <svg width="16" height="12" viewBox="0 0 16 12">
        <path d="M8 11.5 L5.6 9 A3.4 3.4 0 0 1 10.4 9 Z"/>
        <path d="M8 6.2 C6.2 6.2 4.7 6.9 3.6 8 L2.6 7 C4 5.6 5.9 4.7 8 4.7 C10.1 4.7 12 5.6 13.4 7 L12.4 8 C11.3 6.9 9.8 6.2 8 6.2Z"/>
        <path d="M8 1.6 C4.9 1.6 2.2 2.9 0.3 5 L1.3 6 C3 4.1 5.4 3 8 3 C10.6 3 13 4.1 14.7 6 L15.7 5 C13.8 2.9 11.1 1.6 8 1.6Z"/>
      </svg>
      <!-- 배터리 -->
      <svg width="27" height="13" viewBox="0 0 27 13">
        <rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="#fff" stroke-opacity=".4"/>
        <rect x="2" y="2" width="17.5" height="9" rx="2.4"/>
        <path d="M25 4.5 V8.5 C25.8 8.2 26.5 7.3 26.5 6.5 C26.5 5.7 25.8 4.8 25 4.5Z" fill-opacity=".45"/>
      </svg>
    </div>
  </div>

  <!-- 잠금화면 내용 -->
  <div class="lock-content">
    <div class="date" id="date">10월 24일 토요일</div>
    <div class="clock" id="clock">12:54</div>
  </div>

  <div class="no-event">더 이상 이벤트 없음</div>

  <!-- 에어팟 위젯 -->
  <div class="widget">
    <svg viewBox="0 0 58 58">
      <circle cx="29" cy="29" r="26" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/>
      <circle cx="29" cy="29" r="26" fill="none" stroke="#fff" stroke-width="3"
              stroke-dasharray="110 164" stroke-linecap="round" transform="rotate(-90 29 29)"/>
      <!-- 에어팟 아이콘 -->
      <g fill="#fff">
        <rect x="22.5" y="19" width="5.2" height="13" rx="2.6" transform="rotate(-8 25 25)"/>
        <rect x="30.3" y="19" width="5.2" height="13" rx="2.6" transform="rotate(8 33 25)"/>
        <rect x="24" y="34" width="4" height="5" rx="2"/>
      </g>
    </svg>
  </div>

  <!-- 알림 -->
  <div class="notif" id="notif">
    <div class="app-icon" id="appIconBox">
      <span id="appIconText" style="font-size:20px;font-weight:700;color:#333">N</span>
    </div>
    <div class="body">
      <div class="top">
        <span class="app-name" id="appName">Netlify</span>
        <span class="time-ago" id="timeAgo">12분 전</span>
      </div>
      <div class="title" id="nTitle">Let's get your first project live</div>
      <div class="msg" id="nMsg">No experience required. Here's exactly where to start.</div>
    </div>
  </div>

  <!-- 하단 버튼 -->
  <div class="bottom-btn left">
    <svg viewBox="0 0 24 24">
      <rect x="8" y="2.5" width="8" height="4" rx="1"/>
      <path d="M7 6.5 H17 V10 L15 12.5 V21.5 H9 V12.5 L7 10 Z"/>
    </svg>
  </div>
  <div class="bottom-btn right">
    <svg viewBox="0 0 24 24">
      <path d="M3 8 Q3 6.5 4.5 6.5 H7 L8.5 4.5 H15.5 L17 6.5 H19.5 Q21 6.5 21 8 V18 Q21 19.5 19.5 19.5 H4.5 Q3 19.5 3 18 Z"/>
      <circle cx="12" cy="13" r="3.8"/>
    </svg>
  </div>

  <div class="home-bar"></div>
</div>

<!-- 편집 패널 (폰 화면에는 나오지 않음) -->
<div class="panel">
  <h2>화면 설정</h2>

  <label>배경화면 사진</label>
  <input type="file" id="wallInput" accept="image/*">

  <label>알림 앱 아이콘 (선택)</label>
  <input type="file" id="iconInput" accept="image/*">

  <label>앱 이름</label>
  <input type="text" id="inAppName" value="Netlify">

  <label>알림 시간 표시</label>
  <input type="text" id="inTimeAgo" value="12분 전">

  <label>알림 제목</label>
  <input type="text" id="inTitle" value="Let's get your first project live">

  <label>알림 내용</label>
  <input type="text" id="inMsg" value="No experience required. Here's exactly where to start.">

  <label>날짜 / 이벤트 문구</label>
  <input type="text" id="inNoEvent" value="더 이상 이벤트 없음">

  <div class="hint">※ 시계·날짜·상태바 시간은 현재 시각에 맞춰 자동으로 갱신됩니다.</div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  // 시간 / 날짜 (실시간)
  const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    const now = new Date();
    const t = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    $('clock').textContent = t;
    $('statusTime').textContent = t;
    $('date').textContent =
      `${now.getMonth() + 1}월 ${now.getDate()}일 ${DAYS[now.getDay()]}요일`;
  }
  tick();
  setInterval(tick, 1000);

  // 배경화면 변경
  $('wallInput').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    $('wall').style.backgroundImage = `url(${url})`;
  });

  // 알림 앱 아이콘 변경
  $('iconInput').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    $('appIconBox').innerHTML = `<img src="${url}" alt="">`;
  });

  // 텍스트 입력 연결
  const bind = (inputId, targetId) => {
    $(inputId).addEventListener('input', (e) => { $(targetId).textContent = e.target.value; });
  };
  bind('inAppName', 'appName');
  bind('inTimeAgo', 'timeAgo');
  bind('inTitle', 'nTitle');
  bind('inMsg', 'nMsg');
  bind('inNoEvent', 'noEvent');
  $('inNoEvent').addEventListener('input', (e) => {
    document.querySelector('.no-event').textContent = e.target.value;
  });
</script>
</body>
</html>
