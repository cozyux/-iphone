.bubble {
  box-sizing: border-box;
  position: relative;

}

.bubble.in {
  background: #ffffff;

}

.bubble.out {
  background: #1684ff;

  align-self: flex-end;

}

.bubble.in::after {
  content: "";

  left: -6px;

}

.bubble.out::after {
  content: "";

  bottom: 0;
  right: -6px;
  width: 12px;
  height: 13px;
  background: #1684ff;
  clip-path: polygon(0 0, 0 100%, 100% 100%);
}

        // 대화창의 가로 애니메이션 제거
        thread.classList.remove('backing', 'open', 'closing', 'leaving');
        thread.style.transition = 'none';
        thread.style.transform = 'translateX(100%)';
        thread.style.animation = 'none';

        // 메시지 앱 전체를 아래로 닫기
        msg.classList.remove('closing', 'leaving');
        void msg.offsetWidth;
        msg.classList.remove('open');

        window.setTimeout(() => {
            msg.style.transform = '';
            msg.style.opacity = '';
            msg.style.transition = '';

            thread.style.transform = '';
            thread.style.opacity = '';
            thread.style.transition = '';
            thread.style.animation = '';
        }, 450);

        return;
    }

    if (state === 'home') {
        showLock();
    }
});
  // 드래그: 잠금에서 위로 밀면 암호 / 홈에서 아래로 밀면 잠금
  let startY = null, mode = null;
  phone.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.key')) return;
    startY = e.clientY; mode = state;
  });
  window.addEventListener('pointermove', (e) => {
    if (startY === null || mode !== 'lock') return;
    const dy = Math.max(0, startY - e.clientY);
    $('lock').style.transition = 'none';
    $('lock').style.transform = `translateY(${-Math.min(dy, 844)}px)`;
  });
  window.addEventListener('pointerup', (e) => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    $('lock').style.transition = ''; $('lock').style.transform = '';
    if (mode === 'lock' && startY - e.clientY > 100) showPass();
    if (mode === 'home' && dy > 120 && !$('msgApp').classList.contains('open')) showLock();
    startY = null;
  });
new MutationObserver(() => phone.classList.toggle('lightbar', $('msgApp').classList.contains('open')))
  .observe($('msgApp'), { attributes: true, attributeFilter: ['class'] });
</script>
<script>
(() => {
  const phone = document.getElementById('phone');
  const calendarButton = document.getElementById('openWidgetCalendar');
  if (!phone || !calendarButton) return;

  /* ===== 설정 ===== */
  const BASE = '2026-09-27';
  const STORAGE_KEY = 'iphone-calendar-events-v1';
  const WEEK = ['월', '화', '수', '목', '금', '토', '일'];

  let selected = BASE;
  let month = new Date(2026, 8, 1);
  let editingId = null;
  let events = [];

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (Array.isArray(saved)) {
      events = saved.filter(e =>
        e && typeof e.id === 'string' &&
        typeof e.date === 'string' &&
        typeof e.title === 'string'
      );
    }
  } catch (_) {}

  const dateKey = d =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  const parseDate = s => {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  };

  const escapeHTML = value => String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[c]
  );

  function dayEvents(key) {
    return events
      .filter(e => e.date === key)
      .sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  }

  function saveEvents() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      return true;
    } catch (_) {
      alert('브라우저 저장 공간에 저장하지 못했습니다. 현재 화면에는 반영됩니다.');
      return false;
    }
  }

  /* ===== 캘린더 전용 스타일 ===== */
  const style = document.createElement('style');
  style.textContent = `

    #miniCalendarApp .ca-top {

    #miniCalendarApp .ca-month {
      margin-right: auto;

    }

    #miniCalendarApp .ca-top button {
      padding: 5px;

    #miniCalendarApp .ca-top .ca-today {

    }

    #miniCalendarApp .ca-week {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      flex-shrink: 0;

    }

    #miniCalendarApp .ca-week span:nth-last-child(-n+2) {

    #miniCalendarApp .ca-grid {
      display: grid;

    #miniCalendarApp .ca-day {

    }

    #miniCalendarApp .ca-weekend { color: #999; }
    #miniCalendarApp .ca-outside { opacity: .35; }

    #miniCalendarApp .ca-event {

    }

    #miniCalendarApp .ca-details {
      flex: 0 1 auto;
      min-height: 110px;
      max-height: 35%;
      overflow-y: auto;
      padding-top: 18px;
      touch-action: pan-y;
    }

    #miniCalendarApp .ca-date-title {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 700;
    }

    #miniCalendarApp .ca-item {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 10px;
      margin-bottom: 7px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f3f5;
      color: #222;
      text-align: left;
    }

    #miniCalendarApp .ca-time {
      flex: 0 0 58px;
      font-size: 13px;
      font-weight: 600;
    }

    #miniCalendarApp .ca-item-info {
      min-width: 0;
      flex: 1;
      padding-left: 9px;
      border-left: 3px solid #19b5f5;
    }

    #miniCalendarApp .ca-item-info strong {
      display: block;
      overflow-wrap: anywhere;

    }

    #miniCalendarApp .ca-item-info small {
      display: block;
      margin-top: 3px;
      color: #888;
      white-space: pre-wrap;
      overflow-wrap: anywhere;

    }

    #miniCalendarApp .ca-add {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: #f3f3f5;
      color: #222;
      font-size: 16px;
      text-align: left;
    }

    #miniCalendarApp .ca-editor {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 62px 20px 30px;
      overflow-y: auto;
      background: #f5f5f7;
      touch-action: pan-y;
    }

    #miniCalendarApp .ca-editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #miniCalendarApp .ca-editor-head button {
      padding: 8px;
      background: none;
      color: #0785e8;
    }

    #miniCalendarApp .ca-editor label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 13px;
      color: #666;
    }

    #miniCalendarApp .ca-editor input,
    #miniCalendarApp .ca-editor textarea {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #e2e2e5;
      border-radius: 10px;
      background: #fff;
      color: #222;
      user-select: text;
      -webkit-user-select: text;
    }

    #miniCalendarApp .ca-editor textarea {
      min-height: 100px;
      resize: vertical;
    }

    #miniCalendarApp .ca-delete {
      padding: 13px;
      border-radius: 10px;
      background: #fff;
      color: #ff3b30;
    }
  `;
  document.head.appendChild(style);

  /* ===== 홈 화면 월간 위젯 ===== */
  function renderWidget() {
    const base = parseDate(BASE);
    const y = base.getFullYear();
    const m = base.getMonth();
    const first = (new Date(y, m, 1).getDay() + 6) % 7;
    const last = new Date(y, m + 1, 0).getDate();

    let cells = '';

    for (let i = 0; i < first; i++) {
      cells += '<span class="mc-day"></span>';
    }

    for (let d = 1; d <= last; d++) {
      const date = new Date(y, m, d);
      const key = dateKey(date);
      const weekend = [0, 6].includes(date.getDay());
      const marked = dayEvents(key).length > 0;

      cells += `
        <span class="mc-day
          ${weekend ? 'mc-weekend' : ''}
          ${marked ? 'mc-mark' : ''}">
          <span class="${key === BASE ? 'mc-today' : ''}">${d}</span>
        </span>
      `;
    }

    calendarButton.innerHTML = `
      <span class="mc-month">${m + 1}월</span>
      <span class="mc-week">
        ${WEEK.map(w => `<span>${w}</span>`).join('')}
      </span>
      <span class="mc-grid">${cells}</span>
    `;
  }

  /* ===== 내부 캘린더 ===== */
  const panel = document.createElement('section');
  panel.id = 'miniCalendarApp';
  panel.hidden = true;

  panel.innerHTML = `
    <header class="ca-top">
      <span class="ca-month" id="caMonth"></span>
      <button type="button" class="ca-today" data-action="today">
        ↪ TODAY
      </button>
      <button type="button" data-action="prev" aria-label="이전 달">‹</button>
      <button type="button" data-action="next" aria-label="다음 달">›</button>
      <button type="button" data-action="close">닫기</button>
    </header>

    <div class="ca-week">
      ${WEEK.map(w => `<span>${w}</span>`).join('')}
    </div>

    <div class="ca-grid" id="caGrid"></div>

    <section class="ca-details" id="caDetails"></section>

    <form class="ca-editor" id="caEditor" hidden>
      <div class="ca-editor-head">
        <button type="button" data-action="cancel">취소</button>
        <strong id="caEditorTitle">새로운 이벤트</strong>
        <button type="submit">저장</button>
      </div>

      <label>
        제목
        <input id="caTitleInput" required maxlength="100"
               placeholder="일정 제목">
      </label>

      <label>
        날짜
        <input id="caDateInput" type="date" required>
      </label>

      <label>
        시간 · 비워두면 종일
        <input id="caTimeInput" type="time">
      </label>

      <label>
        메모
        <textarea id="caNoteInput" placeholder="메모 입력"></textarea>
      </label>

              id="caDelete" data-action="delete" hidden>
        이벤트 삭제
      </button>

  `;

  phone.appendChild(panel);
  const find = id => panel.querySelector('#' + id);

  function renderCalendar() {
    const y = month.getFullYear();
    const m = month.getMonth();
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;
    const last = new Date(y, m + 1, 0).getDate();
    const rows = Math.ceil((offset + last) / 7);

    find('caMonth').textContent = `${m + 1}`;
    find('caMonth').title = `${y}년 ${m + 1}월`;
    find('caGrid').style.gridTemplateRows =
      `repeat(${rows}, minmax(0, 1fr))`;

    let cells = '';

    for (let i = 0; i < rows * 7; i++) {
      const date = new Date(y, m, i - offset + 1);
      const key = dateKey(date);
      const list = dayEvents(key);

      cells += `
        <button type="button"
          class="ca-day
            ${date.getMonth() !== m ? 'ca-outside' : ''}
            ${i % 7 >= 5 ? 'ca-weekend' : ''}
            ${key === BASE ? 'ca-base' : ''}
            ${key === selected ? 'ca-selected' : ''}"
          data-date="${key}">
          <span class="ca-number">${date.getDate()}</span>
          ${list.slice(0, 3).map(e => `
            <span class="ca-event">${escapeHTML(e.title)}</span>
          `).join('')}
          ${list.length > 3
            ? `<span class="ca-event">+${list.length - 3}</span>`
            : ''}
        </button>
      `;
    }

    find('caGrid').innerHTML = cells;
    renderDetails();
  }

  function renderDetails() {
    const date = parseDate(selected);
    const weekday = ['일', '월', '화', '수', '목', '금', '토'][date.getDay()];

    find('caDetails').innerHTML = `
      <h2 class="ca-date-title">
        ${date.getFullYear()}년 ${date.getMonth() + 1}월
        ${date.getDate()}일 (${weekday})
      </h2>

      ${dayEvents(selected).map(e => `
        <button type="button" class="ca-item"
                data-event-id="${escapeHTML(e.id)}">
          <span class="ca-time">${escapeHTML(e.time || '종일')}</span>
          <span class="ca-item-info">
            <strong>${escapeHTML(e.title)}</strong>
            ${e.note ? `<small>${escapeHTML(e.note)}</small>` : ''}
          </span>
        </button>
      `).join('')}

      <button type="button" class="ca-add" data-action="add">
        ＋ 새로운 이벤트
      </button>
    `;
  }

  function openEditor(event) {
    editingId = event ? event.id : null;

    find('caEditorTitle').textContent =
      event ? '이벤트 편집' : '새로운 이벤트';

    find('caTitleInput').value = event ? event.title : '';
    find('caDateInput').value = event ? event.date : selected;
    find('caTimeInput').value = event ? event.time || '' : '';
    find('caNoteInput').value = event ? event.note || '' : '';
    find('caDelete').hidden = !event;
    find('caEditor').hidden = false;
  }

  calendarButton.addEventListener('click', event => {
    event.stopPropagation();
    selected = BASE;
    month = new Date(2026, 8, 1);
    find('caEditor').hidden = true;
    renderCalendar();
    panel.hidden = false;
  });

  panel.addEventListener('click', event => {
    event.stopPropagation();

    const dateButton = event.target.closest('[data-date]');
    if (dateButton) {
      selected = dateButton.dataset.date;
      const date = parseDate(selected);
      month = new Date(date.getFullYear(), date.getMonth(), 1);
      renderCalendar();
      return;
    }

    const eventButton = event.target.closest('[data-event-id]');
    if (eventButton) {
      const item = events.find(e => e.id === eventButton.dataset.eventId);
      if (item) openEditor(item);
      return;
    }

    const actionButton = event.target.closest('[data-action]');
    if (!actionButton) return;

    switch (actionButton.dataset.action) {
      case 'close':
        panel.hidden = true;
        break;

      case 'today':
        selected = BASE;
        month = new Date(2026, 8, 1);
        renderCalendar();
        break;

      case 'prev':
      case 'next':
        month.setMonth(
          month.getMonth() +
          (actionButton.dataset.action === 'prev' ? -1 : 1)
        );
        renderCalendar();
        break;

      case 'add':
        openEditor(null);
        break;

      case 'cancel':
        find('caEditor').hidden = true;
        break;

      case 'delete':
        if (editingId && confirm('이 일정을 삭제할까요?')) {
          events = events.filter(e => e.id !== editingId);
          saveEvents();
          find('caEditor').hidden = true;
          renderCalendar();
          renderWidget();
        }
        break;
    }
  });

  find('caEditor').addEventListener('submit', event => {
    event.preventDefault();
    event.stopPropagation();

    const title = find('caTitleInput').value.trim();
    const date = find('caDateInput').value;
    if (!title || !date) return;

    const item = {
      id: editingId ||
        `event-${Date.now()}-${Math.random().toString(36).slice(2)}`,
      title,
      date,
      time: find('caTimeInput').value,
      note: find('caNoteInput').value.trim()
    };

    if (editingId) {
      events = events.map(e => e.id === editingId ? item : e);
    } else {
      events.push(item);
    }

    saveEvents();
    selected = date;

    const selectedDate = parseDate(date);
    month = new Date(
      selectedDate.getFullYear(),
      selectedDate.getMonth(),
      1
    );

    find('caEditor').hidden = true;
    renderCalendar();
    renderWidget();
  });

  /* 캘린더 조작을 기존 잠금/홈 스와이프와 분리 */
  [
    'touchstart', 'touchmove', 'touchend',
    'pointerdown', 'pointermove', 'pointerup',
    'mousedown', 'mousemove', 'mouseup'
  ].forEach(type => {
    panel.addEventListener(type, event => event.stopPropagation());
  });

  /* ===== 왼쪽 사진 위젯 유지 ===== */
  const photoInput = document.getElementById('widgetPhotoInput');
  const photo = document.getElementById('widgetPhoto');
  const hint = document.getElementById('widgetPhotoHint');

  let photoURL = '';

  if (photoInput && photo && hint) {
    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (!file || !file.type.startsWith('image/')) return;

      if (photoURL) URL.revokeObjectURL(photoURL);

      photoURL = URL.createObjectURL(file);
      photo.src = photoURL;
      photo.hidden = false;
      hint.hidden = true;
      photoInput.value = '';
    });
  }

  renderWidget();
})();
</script>
<script>
(() => {
  const phone = document.getElementById('phone');
  if (!phone) return;

  function updateStatusColor() {
    /* 기존 흰색 앱: 메시지·대화방 등 */
    const whiteAppOpen = [...phone.querySelectorAll('.app-screen.light.open')]
      .some(app =>
        !app.hidden &&
        !app.classList.contains('hidden') &&
        getComputedStyle(app).display !== 'none'
      );

    /* 새로 만든 캘린더 */
    const calendar = document.getElementById('miniCalendarApp');
    const calendarOpen = Boolean(calendar && !calendar.hidden);

    const shouldBeBlack = whiteAppOpen || calendarOpen;

    /* 기존 lightbar 감지 코드와 분리해서 충돌 방지 */
    if (phone.classList.contains('dark-status') !== shouldBeBlack) {
      phone.classList.toggle('dark-status', shouldBeBlack);
    }
  }

  const observer = new MutationObserver(updateStatusColor);

  observer.observe(phone, {
    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ['class', 'hidden', 'style']
  });

  updateStatusColor();
})();
</script>

  function imageURL(value) {
    const url = String(value || '').trim();
    if (!url) return '';

    const match =
      url.match(/\/file\/d\/([^/?#]+)/) ||
      url.match(/[?&]id=([^&#]+)/);

    return match
      ? 'https://lh3.googleusercontent.com/d/' + match[1]
      : url;
  }

    function avatar(who = 'profile', extra = '') {
    let source = '';

    if (who === 'profile') {
      source = DATA.profile.avatar || '';
    } else if (who.startsWith('post-user-')) {
      const post = DATA.posts[
        Number(who.replace('post-user-', ''))
      ];

               const taggedPerson = DATA.posts
        .flatMap(item => Array.isArray(item.tags) ? item.tags : [])
        .find(person => person.user === post?.user);

      source = post?.user === DATA.profile.name
        ? (DATA.profile.avatar || '')
        : (taggedPerson?.avatar || post?.avatar || '');


    } else if (who.startsWith('chat-')) {
      source = DATA.chats[
        Number(who.replace('chat-', ''))
      ]?.avatar || '';
    } else if (who.startsWith('story-')) {
      source = (DATA.stories || [])[
        Number(who.replace('story-', '')) - 1
      ]?.avatar || '';
    }

    const url = imageURL(source);

    return '<span class="sa-avatar" ' + extra + '>' +
      (url
        ? '<img src="' + esc(url) + '" alt="프로필 사진">'
        : '<span aria-hidden="true">●</span>') +
      '</span>';
  }

   function photo(index, className = 'sa-feed-photo') {
    const post = DATA.posts[index];
    if (!post) return '';

    // images가 있으면 여러 장, 기존 image만 있으면 한 장 표시
    const urls = (
      Array.isArray(post.images) && post.images.length
        ? post.images
        : [post.image || '']
    )
      .map(value => imageURL(value))
      .filter(Boolean);

    const isTile = className === 'sa-tile';
    const first = urls[0];

    // 프로필·검색의 격자에서만 상세 화면으로 연결
    if (isTile) {
      return (
        '<button type="button" class="sa-photo sa-tile"' +
        ' data-post="' + index + '"' +
        ' aria-label="게시물 보기"' +
        ' style="width:100%;padding:0;">' +
        (first
          ? '<img src="' + esc(first) + '" alt="게시물 사진">'
          : '<span>등록된 사진이 없습니다.</span>') +
        '</button>'
      );
    }

    if (!urls.length) {
      return (
        '<div class="sa-photo ' + esc(className) + '">' +
        '<span>등록된 사진이 없습니다.</span>' +
        '</div>'
      );
    }

    // 홈·상세 화면에서는 사진을 눌러도 이동하지 않음
    return (
            '<div class="sa-album' + (post.homeOnly === true ? ' sa-home-square' : '') + '">' +
        '<div class="sa-album-track" aria-label="게시물 사진"' +
          ' onscroll="const n = Math.round(this.scrollLeft / this.clientWidth); const slide = this.children[n]; if (slide) this.style.height = slide.getBoundingClientRect().height + \'px\';">' +
          urls.map((url, i) =>
            '<div class="sa-album-slide' +
              (post.photoModes?.[i] === 'contain'
                ? ' sa-photo-contain'
                : post.photoModes?.[i] === 'natural'
                  ? ' sa-photo-natural'
                  : '') +
            '">' +
              '<img src="' + esc(url) + '"' +
              ' alt="사진 ' + (i + 1) + '">' +
                            (Array.isArray(post.tags) &&
               post.tags.length > 0 &&
               i === Number(post.tagPhoto || 0)
                ? '<button type="button"' +
                    ' class="sa-photo-tag-button"' +
                    ' data-photo-tags="' + index + '"' +
                    ' aria-label="태그된 사람 보기">' +
                    '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                      '<circle cx="12" cy="8" r="4" fill="currentColor"/>' +
                      '<path d="M4 21v-2a8 8 0 0 1 16 0v2Z"' +
                      ' fill="currentColor"/>' +
                    '</svg>' +
                  '</button>'
                : '') +

              (urls.length > 1
                ? '<span class="sa-album-count">' +
                    (i + 1) + ' / ' + urls.length +
                  '</span>'
                : '') +
            '</div>'
          ).join('') +
        '</div>' +
      '</div>'
    );
  }

  /* 게시물 본문: 해시태그·아이디 색상 */
  function captionTextHTML(text) {
    const parts = String(text || '').split(
      /(@[A-Za-z0-9._]+|#[\p{L}\p{N}_]+)/gu
    );

    return parts.map(part => {
      if (part.startsWith('@')) {
        return (
          '<a href="#" data-caption-user="' +
          esc(part.slice(1)) +
          '" style="color:#00376b;text-decoration:none;">' +
          esc(part) +
          '</a>'
        );
      }

      if (part.startsWith('#')) {
        return (
          '<span style="color:#00376b;">' +
          esc(part) +
          '</span>'
        );
      }

      return esc(part);
    }).join('');
  }

  /* 홈 전용 게시물은 두 줄로 접기 */
  function feedCaptionHTML(post) {
    const content =
      '<strong>' + esc(post.user) + '</strong> ' +
      captionTextHTML(post.caption);

    if (post.homeOnly !== true) {
      return '<div class="sa-caption">' + content + '</div>';
    }

    return (
      '<div class="sa-caption" data-folded-caption>' +
        '<span data-caption-body style="' +
          'display:-webkit-box;' +
          '-webkit-box-orient:vertical;' +
          '-webkit-line-clamp:2;' +
          'overflow:hidden;' +
          'white-space:pre-line;' +
        '">' + content + '</span>' +
        '<button type="button" data-caption-more style="' +
          'display:none;border:0;background:none;' +
          'padding:2px 0;color:#888;' +
          'font:inherit;cursor:pointer;' +
        '">더 보기</button>' +
      '</div>'
    );
  }

  /* 긴 본문일 때만 더 보기 표시 */
  function updateCaptionMoreButtons() {
    root.querySelectorAll('[data-folded-caption]').forEach(box => {
      const body = box.querySelector('[data-caption-body]');
      const button = box.querySelector('[data-caption-more]');

      if (body && button) {
        button.style.display =
          body.scrollHeight > body.clientHeight + 1
            ? 'inline-block'
            : 'none';
      }
    });
  }

  new MutationObserver(function () {
    requestAnimationFrame(updateCaptionMoreButtons);
  }).observe(root, {
    childList: true,
    subtree: true,
  });

  window.addEventListener('resize', updateCaptionMoreButtons);

  /* 더 보기 / 본문 속 @아이디 클릭 */
  root.addEventListener('click', function (event) {
    const more = event.target.closest('[data-caption-more]');
    const mention = event.target.closest('[data-caption-user]');

    if (!more && !mention) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    if (more) {
      const box = more.closest('[data-folded-caption]');
      const body = box.querySelector('[data-caption-body]');

      body.style.display = 'block';
      body.style.overflow = 'visible';
      more.remove();
      return;
    }

    const user = mention.dataset.captionUser;

    if (user === DATA.profile.name) {
      page = 'profile';
    } else {
      const person = findPostPerson(user);
      if (!person) return;

      selectedTagProfile = person;
      tagProfileBack = page;
      page = 'tagprofile';
    }

    render();
  }, true);

  /* ===== 클릭 처리 ===== */
  // 마우스로 사진을 잡아 좌우로 넘기기
  root.addEventListener('pointerdown', event => {
    // 휴대폰·태블릿은 기존 터치 스와이프 사용
    if (event.pointerType !== 'mouse' || event.button !== 0) return;

        const album = event.target.closest('.sa-album-track');
    if (!album) return;

    // 사람 아이콘은 사진 드래그 대신 클릭으로 처리
    if (event.target.closest('[data-photo-tags]')) return;

    event.preventDefault();


    const startX = event.clientX;
    const startScroll = album.scrollLeft;
    const width = album.clientWidth;
    const startPage = Math.round(startScroll / width);

    album.setPointerCapture(event.pointerId);

    // 끄는 동안 사진이 손을 따라 움직이도록 설정
    const oldSnap = album.style.scrollSnapType;
    album.style.scrollSnapType = 'none';

    function move(moveEvent) {
      album.scrollLeft =
        startScroll - (moveEvent.clientX - startX);
    }

    function finish(endEvent) {
      album.removeEventListener('pointermove', move);
      album.removeEventListener('pointerup', finish);
      album.removeEventListener('pointercancel', finish);

      if (album.hasPointerCapture(event.pointerId)) {
        album.releasePointerCapture(event.pointerId);
      }

      const distance = startX - endEvent.clientX;
      const threshold = Math.min(60, width * 0.15);

      let nextPage = startPage;

      if (endEvent.type !== 'pointercancel') {
        if (distance > threshold) nextPage += 1;
        if (distance < -threshold) nextPage -= 1;
      }

      nextPage = Math.max(
        0,
        Math.min(album.children.length - 1, nextPage)
      );

      album.style.scrollSnapType = oldSnap;

      album.scrollTo({
        left: nextPage * width,
        behavior: 'smooth',
      });
    }

    album.addEventListener('pointermove', move);
    album.addEventListener('pointerup', finish);
    album.addEventListener('pointercancel', finish);
  });

  root.addEventListener('submit', event => {
    event.preventDefault();

    if (event.target.id === 'saSendForm') {

      const text = input.value.trim();

      if (text) {
             const isOut = root.querySelector('#saSide').value === 'out';
        window.saSideOut = isOut;

        messages[activeChat].push({
          out: isOut,
          text
        });

        render();
        root.querySelector('#saMessageInput').focus();
      }
    }

    if (event.target.id === 'saEditor') {
      try {
        const value = JSON.parse(
          root.querySelector('#saDataEditor').value
        );

        if (
          !value.profile ||
          !Array.isArray(value.posts) ||
          !Array.isArray(value.chats) ||
          !Array.isArray(value.dc) ||
          !value.chats.length
        ) {
          throw new Error();
        }

        if (
          !value.posts.every(
            post => post && typeof post.user === 'string'
          ) ||
          !value.chats.every(
            chat => chat && typeof chat.name === 'string'
          ) ||
          !value.dc.every(
            post => post && typeof post.title === 'string'
          )
        ) {
          throw new Error();
        }

        Object.assign(DATA, value);

        while (messages.length < DATA.chats.length) {
          messages.push([]);
        }

        activeChat = Math.min(
          activeChat,
          DATA.chats.length - 1
        );

        if (page === 'dcpost' && !DATA.dc[dcIndex]) {
          page = 'dc';
        }

        render();

          'profile, posts, chats, dc 구조와 ' +
          '따옴표·쉼표를 유지해야 합니다.'
        );

  [

    'mousemove',

  document.addEventListener('click', event => {

      !app ||
      !['instagram', 'dcinside'].includes(app.dataset.id)
    ) {
      return;
    }

    event.preventDefault();
    event.stopImmediatePropagation();

    page = app.dataset.id === 'instagram' ? 'feed' : 'dc';
    root.hidden = false;
    render();

  // 새로고침 전에 현재 인스타 화면 기억
  window.addEventListener('pagehide', () => {
    try {
      if (root.hidden) {
        sessionStorage.removeItem('lastSocialView');
        return;
      }

      sessionStorage.setItem('lastSocialView', JSON.stringify({
        page,
        activeChat,
        igIndex,
        igBack,
        dcIndex,
        selectedTagProfile,
        tagProfileBack,
      }));
    } catch (error) {}
  });

  // 새로고침 후 그 화면으로 바로 복귀
  try {
    const saved = JSON.parse(
      sessionStorage.getItem('lastSocialView') || 'null'
    );

    if (saved) {
      page = saved.page;
      activeChat = saved.activeChat;
      igIndex = saved.igIndex;
      igBack = saved.igBack;
      dcIndex = saved.dcIndex;
      selectedTagProfile = saved.selectedTagProfile;
      tagProfileBack = saved.tagProfileBack;

      document.getElementById('home').classList.remove('hidden');

      render();

  const homeBar = document.getElementById('homeBar');

  if (homeBar) {

      if (!root.hidden) close();

})();

  /* 탭을 이동해 화면이 다시 생성되어도 적용 */

<script>
(function () {
  const phone = document.getElementById('phone');
  const social = document.getElementById('socialApps');
  const msg = document.getElementById('msgApp');
  const cal = document.getElementById('miniCalendarApp');
  const bar = document.getElementById('homeBar');
  if (!phone) return;

  let sx = 0, sy = 0, on = false;

  function appOpen() {
    if (social && !social.hidden) return 'social';
    if (cal && !cal.hidden) return 'cal';
    if (msg && msg.classList.contains('open')) return 'msg';
    return '';
  }

  function resetStyle(el) {
    el.style.transition = 'none';
    el.style.transform = '';
    el.style.opacity = '';
    el.style.borderRadius = '';
    el.style.transformOrigin = '';
    el.style.visibility = '';
    void el.offsetWidth;
    el.style.transition = '';
  }

  function shrink(el, done, wait) {
    el.style.transition = 'transform .3s ease, opacity .3s ease, border-radius .3s ease';
    el.style.transformOrigin = 'center center';
    el.style.transform = 'scale(.8)';
    el.style.opacity = '0';
    el.style.borderRadius = '40px';
    setTimeout(() => {
      el.style.visibility = 'hidden';
      done();
      setTimeout(() => resetStyle(el), wait);
    }, 300);
  }

  window.addEventListener('pointerdown', e => {
    if (!appOpen()) { on = false; return; }
    const r = phone.getBoundingClientRect();
    on = e.clientX > r.left && e.clientX < r.right &&
         e.clientY > r.top + r.height * 0.8 && e.clientY < r.bottom;
    sx = e.clientX; sy = e.clientY;
  }, true);

  window.addEventListener('pointerup', e => {
    if (!on) return;
    on = false;
    if (sy - e.clientY < 60 || Math.abs(e.clientX - sx) > 100) return;

    const app = appOpen();
    if (app === 'social') {
      shrink(social, () => { social.hidden = true; phone.classList.remove('social-black', 'social-white'); }, 50);
    } else if (app === 'cal') {
      shrink(cal, () => { cal.hidden = true; }, 50);
    } else if (app === 'msg') {
      shrink(msg, () => { bar.click(); }, 700);
    }
  }, true);
})();
</script>

  }

  #highlightViewer .hv-photo {

     #highlightViewer .hv-pause {

    font-size: 28px;
    line-height: 32px;
  }

  #highlightViewer .hv-hit {
    position: absolute;
    top: 90px;
    bottom: 0;
    z-index: 2;
    width: 50%;
  }

  #highlightViewer .hv-prev {
    left: 0;
  }

  #highlightViewer .hv-next {
    right: 0;
  }
</style>

<script>
(function () {
  let activeClose = null;

  function openHighlight(data) {
    if (!Array.isArray(data.images) || !data.images.length) return;

    if (activeClose) activeClose();

    const root = document.getElementById('socialApps');
    if (!root) return;

    const viewer = document.createElement('div');
    viewer.id = 'highlightViewer';
    viewer.setAttribute('role', 'dialog');
    viewer.setAttribute('aria-label', '하이라이트');

    viewer.innerHTML = `
      <img class="hv-photo" alt="하이라이트 사진">

      <div class="hv-top">
        <div class="hv-bars"></div>

        <div class="hv-head">
          <img class="hv-avatar" alt="프로필">
          <strong></strong>
          <span class="hv-title"></span>

          <button
            type="button"
            class="hv-pause"
            aria-label="일시정지"
          >Ⅱ</button>

          <button
            type="button"
            class="hv-close"
            aria-label="닫기"
          >×</button>
        </div>
      </div>

      <button
        type="button"
        class="hv-hit hv-prev"
        aria-label="이전 사진"
      ></button>

      <button
        type="button"
        class="hv-hit hv-next"
        aria-label="다음 사진"
      ></button>
    `;

    document.body.appendChild(viewer);

    viewer.querySelector('strong').textContent = data.user || '';
    viewer.querySelector('.hv-title').textContent = data.title || '';

    const avatar = viewer.querySelector('.hv-avatar');

    if (data.avatar) {
      avatar.src = data.avatar;
    } else {
      avatar.hidden = true;
    }

    const bars = viewer.querySelector('.hv-bars');

    data.images.forEach(function () {
      const bar = document.createElement('div');
      bar.className = 'hv-bar';
      bar.innerHTML = '<div class="hv-fill"></div>';
      bars.appendChild(bar);
    });

    const fills = Array.from(bars.querySelectorAll('.hv-fill'));
    const image = viewer.querySelector('.hv-photo');
        const video = document.createElement('iframe');

    video.title = '하이라이트 영상';
    video.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
    video.allowFullscreen = true;

    Object.assign(video.style, {
      position: 'absolute',
      inset: '0',
      width: '100%',
      height: '100%',
      border: '0',
      display: 'none',
      background: '#000',
    });

    viewer.insertBefore(video, viewer.firstChild);

    const pauseButton = viewer.querySelector('.hv-pause');

    let index = 0;
    let elapsed = 0;
    let previous = performance.now();
    let frame = 0;
    let ready = false;
    let paused = false;
    let closed = false;

    function fit() {
      const rect = root.getBoundingClientRect();

      Object.assign(viewer.style, {
        left: rect.left + 'px',
        top: rect.top + 'px',
        width: rect.width + 'px',
        height: rect.height + 'px',
        borderRadius: getComputedStyle(root).borderRadius,
      });
    }

    function close() {
      if (closed) return;

      closed = true;
      cancelAnimationFrame(frame);
      window.removeEventListener('resize', fit);
      document.removeEventListener('keydown', handleKeys);
      viewer.remove();
      activeClose = null;
    }

        function show(nextIndex) {
      if (nextIndex >= data.images.length) {
        close();
        return;
      }

      index = Math.max(0, nextIndex);
      elapsed = 0;
      ready = false;

      fills.forEach(function (fill, fillIndex) {
        fill.style.width = fillIndex < index ? '100%' : '0%';
      });

      const url = data.images[index];
      const isVideo =
        /^https:\/\/www\.youtube\.com\/embed\/[\w-]+/.test(url);

      video.removeAttribute('src');

      if (isVideo) {
        image.style.display = 'none';
        video.style.display = 'block';

        // 재생 버튼을 직접 누를 수 있도록 영상 위 터치 영역 숨김
        viewer.querySelector('.hv-prev').style.display = 'none';
        viewer.querySelector('.hv-next').style.display = 'none';

        video.referrerPolicy = 'strict-origin-when-cross-origin';

        video.src =
          url +
          '?autoplay=1&mute=1&playsinline=1&rel=0';

        // 영상은 15초 타이머 대신 직접 닫아서 종료
        ready = false;
      } else {
        video.style.display = 'none';
        image.style.display = 'block';

        viewer.querySelector('.hv-prev').style.display = '';
        viewer.querySelector('.hv-next').style.display = '';

        image.src = url;
      }
    }

    image.onload = function () {
      ready = true;
      previous = performance.now();
    };

    image.onerror = function () {
      ready = true;
      previous = performance.now();
    };

    function handleKeys(event) {
      if (event.key === 'Escape') close();
      if (event.key === 'ArrowRight') show(index + 1);
      if (event.key === 'ArrowLeft') show(index - 1);
    }

    viewer.querySelector('.hv-close').onclick = close;

    viewer.querySelector('.hv-next').onclick = function () {
      show(index + 1);
    };

    viewer.querySelector('.hv-prev').onclick = function () {
      show(index - 1);
    };

    pauseButton.onclick = function () {
      paused = !paused;
      this.textContent = paused ? '▶' : 'Ⅱ';
      this.setAttribute('aria-label', paused ? '재생' : '일시정지');
    };

    function tick(now) {
      if (closed) return;

      const delta = now - previous;
      previous = now;

      if (ready && !paused && !document.hidden) {
        elapsed += Math.min(delta, 100);

        fills[index].style.width =
          Math.min(100, elapsed / 150) + '%';

        if (elapsed >= 15000) {
          show(index + 1);
        }
      }

      if (!closed) {
        frame = requestAnimationFrame(tick);
      }
    }

    activeClose = close;
    fit();

    window.addEventListener('resize', fit);
    document.addEventListener('keydown', handleKeys);

    show(0);
    frame = requestAnimationFrame(tick);
  }

  document.addEventListener('click', function (event) {
    const item = event.target.closest('[data-highlight-view]');
    if (!item) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    try {
      openHighlight(JSON.parse(item.dataset.highlightView));
    } catch (error) {
      console.error(error);
    }
  }, true);

  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;

    const item = event.target.closest('[data-highlight-view]');

    if (item) {
      event.preventDefault();
      item.click();
    }
  });
})();
</script>
